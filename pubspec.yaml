name: slopcafe_ui
# The Dart package name stays `slopcafe_ui` — it is the `package:` prefix every
# import and test in the tree already uses, and renaming it would buy nothing.
# The *product* name is "Slopcafe Operator", and it lives where a human reads
# it: `appTitle` in lib/l10n/app_en.arb, plus web/index.html and
# web/manifest.json.
description: "Slopcafe Operator — the operator console for a Slopcafe deployment."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Localization. All user-facing copy lives in lib/l10n/app_en.arb and is
  # code-generated into AppLocalizations via Flutter's gen-l10n pipeline (see
  # l10n.yaml). Adding a language = drop a new app_<locale>.arb beside it.
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.3.1
  
  # HTTP client
  dio: ^5.7.0

  # Secure Storage
  flutter_secure_storage: ^10.3.1

  # Document rendering. Both of these are reached only through the
  # DocumentRenderer seam in lib/core/document_view/: webview_flutter from the
  # io implementation (macOS · iOS · Android), package:web from the browser one,
  # which renders into a sandboxed `srcdoc` iframe instead. `web` was already in
  # the tree transitively; it is declared here because the analyzer rightly
  # refuses to let a package import something it never asked for.
  webview_flutter: ^4.9.0
  webview_flutter_wkwebview: ^3.24.2
  web: ^1.1.1
  path_provider: ^2.1.5

  # Date formatting (pinned by flutter_localizations from the SDK)
  intl: ^0.20.2

  # Code generation annotations
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0
  url_launcher: ^6.3.2
  app_links: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generators
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  freezed: ^3.2.5

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

  # Pure-Dart image manipulation, used only by tool/gen_adaptive_foreground.dart
  # to derive the Android adaptive-icon foreground from the source art.
  image: ^4.3.0

# App launcher icons. Source art lives in assets/icon/app_icon.png; regenerate
# the platform icons after changing it with: dart run flutter_launcher_icons
#
# Android uses an adaptive icon so the brown field bleeds edge-to-edge under any
# launcher mask. The background layer is the flat field colour; the foreground
# (assets/icon/app_icon_foreground.png) is the cup pre-scaled into the adaptive
# safe zone (~61% of the canvas) so the saucer is never cropped. Regenerate the
# foreground with: dart run tool/gen_adaptive_foreground.dart (after editing the
# source art). image_path stays as the legacy fallback for Android < 8.
#
# macOS is the opposite case: it applies no mask at all, so a full-bleed square
# lands as a hard-cornered square between rounded neighbours in the Dock. Its
# appiconset is generated by tool/gen_macos_icon.dart instead (hence
# macos.generate: false below), which seats the art in Apple's icon grid —
# squircle-cropped, with the system drop shadow — and renders every slot at its
# native size. That last part is why flutter_launcher_icons cannot do the job:
# it downscales one master, and Apple's grid uses a *larger* body ratio for the
# 16/32/64px slots than for the rest. Regenerate with:
#   dart run tool/gen_macos_icon.dart
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  adaptive_icon_background: "#65381D"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  # The foreground is already pre-scaled into the safe zone by
  # tool/gen_adaptive_foreground.dart, so suppress the tool's default 16% inset
  # (which would double-shrink the cup) and use the art as-authored.
  adaptive_icon_foreground_inset: 0
  ios: false
  remove_alpha_ios: false
  macos:
    generate: false

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # Generate AppLocalizations from the ARB files in lib/l10n (config: l10n.yaml).
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Cortado's display face, bundled — see the long note in
  # lib/core/design/typography.dart for the whole story. The short version:
  # the design system asks for a serif, the styles used to reach for one by
  # NAME ('Georgia', 'Times New Roman', 'serif'), and the web engine cannot
  # resolve a name it was not handed a file for. On the web every one of those
  # names lands on the default sans, silently, so the app's signature type
  # simply was not there. One file fixes it on every platform at once.
  #
  # Regular only, deliberately: every serif style the app actually uses is
  # upright, all asset fonts are fetched before the first web frame, and the
  # italic face is another 64 KB on that critical path for a style with no call
  # sites. `AppText.serifItalic` is left on the platform stack for exactly that
  # reason — typography.dart says so, and says what to do if it ever needs a
  # real italic.
  #
  # SIL Open Font License 1.1; the licence text ships beside the font at
  # assets/fonts/OFL.txt. Flutter auto-registers a *package's* LICENSE with
  # LicenseRegistry but never an app's own font asset, so if this app ever
  # grows an About/licences page, this is the one entry that must be added by
  # hand.
  fonts:
    - family: Instrument Serif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf

  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
